name: Phase 4.5 Correctness

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, phase-4.5-correctness]

jobs:
  correctness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.20
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run test:unit
      - run: bun run test:golden
      - run: bun run test:invariants
      - run: bun run test:reproducibility
      - run: bun run test:coverage
      - run: bun run build
